<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Urbanitae · Inversiones</title>
<meta name="theme-color" content="#123B34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Urbanitae">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #F6F5F1; --panel: #FFFFFF; --fg: #1C2321; --mut: #66706D; --line: #E3E1DA;
  --acc: #1F7A68; --acc2: #9CC9BD; --warn: #A86A12; --bad: #B23B3B; --ok: #2E7D4F; --chip: #EEF4F2;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0F1513; --panel: #17201D; --fg: #E8EDEB; --mut: #9AA6A2; --line: #26322E; --acc: #4FB89F; --acc2: #2D5F54; --warn: #E0A64A; --bad: #E07070; --ok: #6CC08F; --chip: #1E2B27; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* Bloqueo */
#lock { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.lockbox { width: 100%; max-width: 340px; text-align: center; }
.lockbox img { width: 72px; height: 72px; border-radius: 18px; }
.lockbox h1 { font-size: 22px; margin: 14px 0 4px; }
.lockbox p { color: var(--mut); margin: 0 0 18px; }
.lockbox input[type=password] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.lockbox label { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 12px 0; color: var(--mut); font-size: 14px; }
.btn { appearance: none; border: 0; background: var(--acc); color: #fff; padding: 12px 18px; border-radius: 10px; width: 100%; font-weight: 600; cursor: pointer; }
.btn:disabled { opacity: .6; }
#err { color: var(--bad); min-height: 1.4em; margin-top: 10px; font-size: 14px; }

/* App */
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px 6px; max-width: 1200px; margin: 0 auto; }
.topbar h1 { font-size: 18px; margin: 0; flex: 1; }
.topbar select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.iconbtn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--mut); }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 12px; max-width: 1200px; margin: 0 auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 0 0 auto; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 10px; color: var(--mut); cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--acc); font-weight: 600; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.lede { color: var(--mut); margin: 0 0 16px; }
.lede b { color: var(--fg); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--mut); }
.kpi .v { font-size: 22px; font-weight: 650; margin-top: 4px; }
.kpi .s { font-size: 12px; color: var(--mut); margin-top: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 16px; }
h2 { font-size: 16px; margin: 0 0 2px; }
.cap { font-size: 12.5px; color: var(--mut); margin: 0 0 12px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--mut); font-size: 11px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--mut); margin-bottom: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.15); border-radius: 8px; padding: 6px 9px; font-size: 12px; white-space: nowrap; z-index: 3; }
.tip span { color: var(--mut); }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13.5px; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { font-size: 11.5px; color: var(--mut); font-weight: 600; }
th.l, td.l { text-align: left; }
td.name { white-space: normal; min-width: 12rem; text-align: left; }
td.name a { color: inherit; text-decoration: none; }
.note { display: block; font-size: 11.5px; color: var(--warn); }
.sub { display: block; font-size: 11.5px; color: var(--mut); }
tr.grp td { background: var(--chip); font-weight: 600; text-align: left; }
.neg { color: var(--bad); }
.pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--chip); color: var(--mut); }
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.bar select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
.pivot th, .pivot td { padding: 5px 7px; }
.pivot thead th { background: var(--chip); }
.pivot .y { text-align: center; border-left: 1px solid var(--line); }
.pivot .q0 { border-left: 1px solid var(--line); }
.pivot .stk { position: sticky; left: 0; background: var(--panel); z-index: 1; text-align: left; white-space: normal; min-width: 11rem; }
.pivot thead .stk { background: var(--chip); }
.pivot tfoot td { font-weight: 650; border-top: 2px solid var(--mut); }
.pivot .tot { font-weight: 650; }
/* Lista de tarjetas en el móvil */
.cards { display: none; }
@media (max-width: 640px) {
  .wide-only { display: none; }
  .cards { display: grid; gap: 10px; }
  .kpi .v { font-size: 19px; }
  td.name { min-width: 0; }
  th, td { padding: 7px 5px; }
}
.icard .h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.icard .h a { color: inherit; text-decoration: none; font-weight: 600; }
.icard dl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 10px 0 0; }
.icard dt { font-size: 11px; color: var(--mut); }
.icard dd { margin: 0; font-variant-numeric: tabular-nums; }
details.foot { margin: 20px 0 8px; font-size: 12.5px; color: var(--mut); }
details.foot summary { cursor: pointer; }
.updated { font-size: 12px; color: var(--mut); margin-top: 6px; }
</style>
</head>
<body>

<section id="lock">
  <form class="lockbox" id="lockForm" autocomplete="on">
    <img src="icon-192.png" alt="">
    <h1>Inversiones Urbanitae</h1>
    <p>Introduce la contraseña para ver los datos.</p>
    <input type="text" name="username" value="urbanitae" autocomplete="username" hidden>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Contraseña" required>
    <label><input type="checkbox" id="remember" checked> Recordar en este dispositivo</label>
    <button class="btn" id="unlockBtn" type="submit">Entrar</button>
    <div id="err" role="alert"></div>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="topbar">
      <h1>Urbanitae</h1>
      <select id="titular" aria-label="Titular"></select>
      <button class="iconbtn" id="lockBtn" title="Bloquear" aria-label="Bloquear">🔒</button>
    </div>
    <nav class="tabs" role="tablist">
      <button data-tab="resumen" class="on">Resumen</button>
      <button data-tab="inversiones">Inversiones</button>
      <button data-tab="calendario">Calendario de pagos</button>
      <button data-tab="tabla">Tabla por trimestres</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
};
const SVG = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs = {}) => { const e = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
const nf = (d) => new Intl.NumberFormat('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: 'always' });
const eur = (v) => (v === null || v === undefined || isNaN(v) ? '—' : nf(0).format(Math.round(v)) + ' €');
const eur2 = (v) => (v === null || v === undefined || isNaN(v) ? '—' : nf(2).format(v) + ' €');
const pct = (v) => (v === null || v === undefined || isNaN(v) ? '—' : nf(1).format(v) + ' %');
const kfmt = (v) => (v >= 1000 ? nf(0).format(v / 1000) + 'k' : nf(0).format(v));
const fdate = (s) => { if (!s) return '—'; const [y, m, d] = s.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const trim = (q) => (q ? q.replace(/^(\d{4})-Q(\d)$/, '$2T $1') : '—');
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const by = (f, desc) => (a, b) => { const x = f(a), y = f(b); return (x < y ? -1 : x > y ? 1 : 0) * (desc ? -1 : 1); };
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: (k) => { try { localStorage.removeItem(k); } catch (e) {} } };
const safeUrl = (u) => (/^https:\/\/urbanitae\.com\//.test(u || '') ? u : null);

/* ---------- cifrado ---------- */
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(pw) {
  const res = await fetch('data.enc.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error('net');
  const pkg = await res.json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(pkg.salt), iterations: pkg.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(pkg.iv) }, key, b64(pkg.data));
  if (pkg.z) { const ds = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip')); return JSON.parse(await new Response(ds).text()); }
  return JSON.parse(new TextDecoder().decode(plain));
}

let D = null;
const state = { tab: 'resumen', titular: store.get('urb-titular') || '', estado: 'En curso', orden: 'vencimiento_estimado' };

async function unlock(pw, remember) {
  const btn = $('#unlockBtn'); btn.disabled = true; btn.textContent = 'Abriendo…'; $('#err').textContent = '';
  try {
    D = await decrypt(pw);
    if (remember) store.set('urb-pw', pw); else store.del('urb-pw');
    $('#lock').hidden = true; $('#app').hidden = false;
    fillTitulares();
    const h = location.hash.slice(1);
    go(['resumen', 'inversiones', 'calendario', 'tabla'].includes(h) ? h : 'resumen');
  } catch (e) {
    store.del('urb-pw');
    $('#err').textContent = e.message === 'net' ? 'No se pudieron descargar los datos. Revisa la conexión.' : 'Contraseña incorrecta.';
  } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
}
$('#lockForm').addEventListener('submit', (e) => { e.preventDefault(); unlock($('#pw').value.trim(), $('#remember').checked); });
$('#lockBtn').addEventListener('click', () => { store.del('urb-pw'); D = null; $('#main').replaceChildren(); $('#pw').value = ''; $('#app').hidden = true; $('#lock').hidden = false; });
const saved = store.get('urb-pw'); if (saved) unlock(saved, true);

function fillTitulares() {
  const s = $('#titular'); s.replaceChildren();
  const ts = Object.entries(D.titulares || {});
  if (ts.length > 1) s.append(el('option', { value: '', text: 'Todos' }));
  ts.forEach(([k, v]) => s.append(el('option', { value: k, text: v })));
  if (!ts.some(([k]) => k === state.titular)) state.titular = ts.length > 1 ? '' : (ts[0] || [''])[0];
  s.value = state.titular; s.hidden = ts.length < 2 && false;
  s.onchange = () => { state.titular = s.value; store.set('urb-titular', s.value); render(); };
}

/* ---------- navegación ---------- */
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => go(b.dataset.tab)));
function go(tab) {
  state.tab = tab;
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  history.replaceState(null, '', '#' + tab);
  render(); window.scrollTo(0, 0);
}
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => D && render(), 150); });

/* ---------- datos derivados ---------- */
function data() {
  const t = state.titular;
  const inv = D.inversiones.filter((r) => !t || r.titular === t);
  const pag = D.pagos.filter((p) => !t || p.titular === t);
  const curso = inv.filter((r) => r.estado === 'En curso');
  const invC = sum(curso, (r) => r.importe_invertido), totC = sum(curso, (r) => r.total_esperado_bruto);
  const prox = curso.filter((r) => r.vencimiento_estimado).sort(by((r) => r.vencimiento_estimado))[0];
  const k = {
    invertido_en_curso: invC, invertido_total: sum(inv, (r) => r.importe_invertido), n_en_curso: curso.length, n_total: inv.length,
    capital_activo: sum(inv, (r) => r.capital_activo), cobrado: sum(pag.filter((p) => p.estado === 'cobrado'), (p) => p.importe_bruto),
    pendiente: sum(curso, (r) => r.pendiente_hasta_total_bruto), total_esperado: totC, beneficio: totC - invC,
    rentabilidad: invC ? (totC / invC - 1) * 100 : null, prox,
  };
  const q = new Map(); const gq = (x) => q.get(x) || (q.set(x, { q: x, cobrado: 0, previsto: 0 }), q.get(x));
  pag.filter((p) => p.estado === 'cobrado').forEach((p) => { gq(p.trimestre).cobrado += p.importe_bruto; });
  curso.filter((r) => r.vencimiento_trimestre).forEach((r) => { gq(r.vencimiento_trimestre).previsto += r.pendiente_hasta_total_bruto; });
  const porTrim = [...q.values()].sort(by((x) => x.q));
  const ya = new Map(); curso.filter((r) => r.vencimiento_trimestre).forEach((r) => { const y = r.vencimiento_trimestre.slice(0, 4); ya.set(y, (ya.get(y) || 0) + r.pendiente_hasta_total_bruto); });
  const porAnio = [...ya.entries()].sort().map(([y, v]) => ({ q: y, previsto: v }));
  const mm = new Map(); curso.forEach((r) => { const m = mm.get(r.modelo) || { modelo: r.modelo, invertido: 0, beneficio: 0, n: 0 }; m.invertido += r.importe_invertido; m.beneficio += r.beneficio_esperado; m.n++; mm.set(r.modelo, m); });
  return { inv, pag, curso, k, porTrim, porAnio, porModelo: [...mm.values()].sort(by((m) => m.invertido, true)) };
}

/* ---------- gráficos ---------- */
function tooltip(box) {
  const t = el('div', { class: 'tip', hidden: true }); box.append(t);
  return {
    show(ev, lines) {
      t.replaceChildren(...lines.map(([a, b], i) => (i === 0 ? el('div', { style: 'font-weight:600', text: a }) : el('div', {}, el('span', { text: a + ': ' }), b))));
      t.hidden = false;
      const r = box.getBoundingClientRect(), p = ev.touches ? ev.touches[0] : ev;
      let x = p.clientX - r.left + 12; const y = Math.max(0, p.clientY - r.top - 40);
      if (x + t.offsetWidth > r.width) x = Math.max(0, p.clientX - r.left - t.offsetWidth - 12);
      t.style.left = x + 'px'; t.style.top = y + 'px';
    },
    hide() { t.hidden = true; },
  };
}
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

function columns(box, rows, { keys, colors, names, label, height = 230 }) {
  const W = Math.max(280, box.clientWidth || 320), H = height, mb = 22, mt = 14;
  const max = niceMax(Math.max(1, ...rows.map((r) => sum(keys, (k) => r[k] || 0))));
  const ticks = [0, .25, .5, .75, 1].map((f) => f * max);
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': box.getAttribute('aria-label') || '' });
  box.append(svg);
  const tl = ticks.map((t) => { const x = sv('text', { x: 0, y: 0 }); x.textContent = kfmt(t); svg.append(x); return x; });
  const ml = Math.ceil(Math.max(...tl.map((x) => x.getComputedTextLength() || 24))) + 8;
  const y = (v) => H - mb - (v / max) * (H - mb - mt);
  ticks.forEach((t, i) => { tl[i].setAttribute('x', ml - 6); tl[i].setAttribute('y', y(t) + 4); tl[i].setAttribute('text-anchor', 'end'); svg.insertBefore(sv('line', { x1: ml, x2: W, y1: y(t), y2: y(t), stroke: 'var(--line)' }), svg.firstChild); });
  const step = (W - ml - 14) / rows.length, bw = Math.max(4, step * .68);
  const every = Math.ceil(rows.length / Math.max(1, Math.floor((W - ml) / 44)));
  const tip = tooltip(box);
  rows.forEach((r, i) => {
    const x = ml + i * step + (step - bw) / 2; let acc = 0;
    keys.forEach((k, j) => { const v = r[k] || 0; if (!v) return; svg.append(sv('rect', { x, width: bw, y: y(acc + v), height: Math.max(1, y(acc) - y(acc + v)), rx: 2, fill: colors[j] })); acc += v; });
    if (i % every === 0) { const t = sv('text', { x: x + bw / 2, y: H - 6, 'text-anchor': 'middle' }); t.textContent = label(r.q); svg.append(t); }
    if (acc && bw > 30) { const t = sv('text', { x: x + bw / 2, y: y(acc) - 4, 'text-anchor': 'middle' }); t.textContent = kfmt(acc); svg.append(t); }
    const hit = sv('rect', { x: ml + i * step, width: step, y: 0, height: H - mb, fill: 'transparent' });
    const show = (ev) => tip.show(ev, [[label(r.q, true)], ...keys.filter((k) => r[k]).map((k) => [names[keys.indexOf(k)], eur(r[k])])]);
    hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show); hit.addEventListener('pointerleave', () => tip.hide());
    svg.append(hit);
  });
}

function hbars(box, rows) {
  const W = Math.max(280, box.clientWidth || 320), rh = 34, H = rows.length * rh + 4;
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Invertido y beneficio esperado por tipo' }); box.append(svg);
  const labs = rows.map((r, i) => { const t = sv('text', { x: 0, y: i * rh + rh / 2 + 4 }); t.textContent = r.modelo; svg.append(t); return t; });
  const ml = Math.max(...labs.map((t) => t.getComputedTextLength() || 60)) + 10;
  const ends = rows.map((r) => eur(r.invertido) + ' + ' + eur(r.beneficio));
  const probe = sv('text', {}); probe.textContent = ends.reduce((a, b) => (a.length > b.length ? a : b), ''); svg.append(probe);
  const mr = (probe.getComputedTextLength() || 120) + 8; probe.remove();
  const max = Math.max(1, ...rows.map((r) => r.invertido + r.beneficio)), x = (v) => ml + (v / max) * Math.max(40, W - ml - mr);
  const tip = tooltip(box);
  rows.forEach((r, i) => {
    const y0 = i * rh + 6, h = rh - 12;
    svg.append(sv('rect', { x: ml, y: y0, height: h, width: x(r.invertido) - ml, rx: 2, fill: 'var(--acc2)' }));
    svg.append(sv('rect', { x: x(r.invertido), y: y0, height: h, width: Math.max(0, x(r.invertido + r.beneficio) - x(r.invertido)), rx: 2, fill: 'var(--acc)' }));
    const t = sv('text', { x: x(r.invertido + r.beneficio) + 6, y: y0 + h / 2 + 4 }); t.textContent = ends[i]; svg.append(t);
    const hit = sv('rect', { x: 0, y: i * rh, width: W, height: rh, fill: 'transparent' });
    const show = (ev) => tip.show(ev, [[r.modelo], ['Proyectos', String(r.n)], ['Invertido', eur(r.invertido)], ['Beneficio esperado', eur(r.beneficio)]]);
    hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show); hit.addEventListener('pointerleave', () => tip.hide());
    svg.append(hit);
  });
}

/* ---------- vistas ---------- */
